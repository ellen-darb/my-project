name: Проверки
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: pip install -r requirements.txt
      # тесты: ограничения линии на 120 днях, отсутствие подглядывания в будущее, совпадение расчёта сайта с Python
      - run: python -m pytest -q tests
      # воспроизводимость: пересчёт выгрузки даёт те же файлы, что лежат в репозитории
      - run: python pipeline/export.py > /dev/null
      - run: git diff --exit-code --stat -- site/public/data
      - run: npm ci && npm run build
        working-directory: site
